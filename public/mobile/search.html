<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#667eea">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Pencarian - ABI Mobile</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/mobile/css/mobile.css">
</head>

<body>
    <div id="alert-container"></div>

    <div id="loading-overlay" class="d-none">
        <div class="text-center">
            <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
            <p class="mt-3 text-muted fw-bold" id="loadingText">Memuat data...</p>
        </div>
    </div>

    <main class="container" id="searchView">
        <!-- Page Header -->
        <div class="mobile-page-header">
            <div style="flex: 1;">
                <h1>
                    <i class="bi bi-search me-1"></i>
                    Pencarian
                </h1>
                <div class="subtitle">Cari keluarga atau filter person</div>
            </div>
        </div>

        <!-- Custom Tabs -->
        <div class="mobile-tabs" role="tablist">
            <button class="mobile-tab active" id="family-tab" data-tab="familySearch" type="button">
                <i class="bi bi-people me-1"></i>Keluarga
            </button>
            <button class="mobile-tab" id="person-tab" data-tab="personFilter" type="button">
                <i class="bi bi-person me-1"></i>Filter Person
            </button>
        </div>

        <!-- Tab Content -->
        <div id="searchTabContent">

            <!-- ===== Tab 1: Cari Keluarga ===== -->
            <div class="tab-pane active" id="familySearch">
                <!-- Search Box -->
                <div class="mobile-search-box">
                    <div class="mobile-search-wrapper">
                        <i class="bi bi-search mobile-search-icon"></i>
                        <input type="text" class="mobile-search-input" id="searchInput"
                            placeholder="Cari nama atau alamat..." autocomplete="off">
                        <button class="mobile-search-clear d-none" id="clearSearchBtn" type="button" aria-label="Hapus">
                            <i class="bi bi-x-lg"></i>
                        </button>
                    </div>
                    <div class="form-text" style="margin-top: 6px; padding: 0 4px;">
                        Pencarian otomatis (jeda 300ms)
                    </div>
                </div>

                <!-- Results Container -->
                <div id="searchResultsContainer">
                    <div class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>Mulai ketik untuk mencari data keluarga</p>
                    </div>
                </div>
            </div>

            <!-- ===== Tab 2: Filter Person ===== -->
            <div class="tab-pane" id="personFilter">
                <!-- Filter Form -->
                <div class="filter-section">
                    <!-- Pekerjaan -->
                    <div class="mb-3">
                        <label class="filter-section-title">
                            <i class="bi bi-briefcase me-1"></i>Pekerjaan
                        </label>
                        <input type="text" class="form-control" id="filterPekerjaan"
                            placeholder="Ketik pekerjaan (misal: buruh)">
                        <div class="form-text">Partial match (mengandung kata)</div>
                    </div>

                    <!-- Status ABI -->
                    <div class="mb-3">
                        <label class="filter-section-title">
                            <i class="bi bi-person-badge me-1"></i>Status ABI
                        </label>
                        <select class="form-select" id="filterStatusABI">
                            <option value="">-- Semua --</option>
                        </select>
                    </div>

                    <!-- Kaderisasi -->
                    <div class="mb-3">
                        <label class="filter-section-title">
                            <i class="bi bi-award me-1"></i>Kaderisasi
                        </label>
                        <select class="form-select" id="filterKaderisasi">
                            <option value="">-- Semua --</option>
                        </select>
                    </div>

                    <!-- Usia -->
                    <div class="mb-3">
                        <label class="filter-section-title">
                            <i class="bi bi-calendar3 me-1"></i>Rentang Usia (tahun)
                        </label>
                        <div class="input-group">
                            <input type="number" class="form-control" id="filterUsiaMin" placeholder="Min" min="0"
                                max="120">
                            <span class="input-group-text">s/d</span>
                            <input type="number" class="form-control" id="filterUsiaMax" placeholder="Max" min="0"
                                max="120">
                        </div>
                    </div>

                    <!-- Penghasilan -->
                    <div class="mb-2">
                        <label class="filter-section-title">
                            <i class="bi bi-cash-stack me-1"></i>Rentang Penghasilan
                        </label>
                        <select class="form-select mb-2" id="filterPenghasilanBracket">
                            <option value="">-- Semua --</option>
                            <option value="custom">Custom (isi manual)</option>
                        </select>
                        <div id="customPenghasilanContainer" class="d-none">
                            <div class="input-group">
                                <span class="input-group-text">Rp</span>
                                <input type="text" class="form-control format-rupiah-filter" id="filterPenghasilanMin"
                                    placeholder="Dari" inputmode="numeric">
                            </div>
                            <div style="text-align: center; padding: 4px; color: #6c757d; font-size: 12px;">s/d</div>
                            <div class="input-group">
                                <span class="input-group-text">Rp</span>
                                <input type="text" class="form-control format-rupiah-filter" id="filterPenghasilanMax"
                                    placeholder="Sampai" inputmode="numeric">
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div style="display: flex; gap: 8px; margin-bottom: 16px;">
                    <button type="button" class="btn btn-primary" id="btnTerapkanFilter" style="flex: 2;">
                        <i class="bi bi-check-circle me-1"></i>Terapkan Filter
                    </button>
                    <button type="button" class="btn btn-outline-secondary" id="btnResetFilter" style="flex: 1;">
                        <i class="bi bi-x-circle me-1"></i>Reset
                    </button>
                </div>

                <!-- Results Container -->
                <div id="personFilterResultsContainer">
                    <div class="empty-state">
                        <i class="bi bi-funnel"></i>
                        <p>Gunakan filter di atas untuk mencari person</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <div id="mobile-navbar-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Entry point controller (SAMA dengan versi desktop) -->
    <script type="module" src="/src/controllers/SearchController.js"></script>

    <!-- Mobile Navbar, Tabs, Auto-format -->
    <script type="module">
        import { renderMobileNavbar } from '/mobile/js/MobileNavbarComponent.js';
        renderMobileNavbar();

        // Custom tab switching (tanpa Bootstrap tabs, lebih mobile-friendly)
        const tabs = document.querySelectorAll('.mobile-tab');
        const panes = document.querySelectorAll('.tab-pane');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const targetId = tab.dataset.tab;

                // Update active tab
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // Update active pane
                panes.forEach(p => p.classList.remove('active'));
                document.getElementById(targetId).classList.add('active');
            });
        });

        // Auto-format Rupiah untuk filter penghasilan
        document.querySelectorAll('.format-rupiah-filter').forEach(input => {
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                e.target.value = value ? new Intl.NumberFormat('id-ID').format(value) : '';
            });
        });
    </script>
</body>

</html>
